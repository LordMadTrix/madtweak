# ------------------------------------------------------------------------------
# Le cinquième filet.
#
# Les quatre premiers (Test-ClesProfils, Test-CoherenceAudit, Test-Explications et
# le relevé $script:ClesJouees) protègent le CODE. Celui-ci protège le PRODUIT :
# il vérifie que dist/MadTweak.ps1 correspond bien aux modules de src/.
#
# Sans lui, une modification de src/ poussée sans rebuild livrerait un fichier
# obsolète aux utilisateurs — en silence, puisque rien ne planterait.
# ------------------------------------------------------------------------------
name: Vérifier la construction

on:
  push:
    branches: [main]
    paths: ['src/**', 'dist/**', 'build.ps1', '.github/workflows/verifier.yml']
  pull_request:
    paths: ['src/**', 'dist/**', 'build.ps1']
  workflow_dispatch:

jobs:
  verifier:
    # Windows PowerShell 5.1 : la version que le script cible réellement, et la seule
    # qui reproduit le piège d'encodage (BOM absent = accents illisibles).
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Version de PowerShell utilisée
        shell: powershell
        run: $PSVersionTable | Format-List

      - name: dist correspond-il à src ?
        shell: powershell
        run: |
          .\build.ps1 -Verifier
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::dist\MadTweak.ps1 ne correspond plus aux modules de src\. Lance .\build.ps1 puis recommite le résultat."
            exit 1
          }

      - name: Les modules sont-ils en UTF-8 AVEC BOM ?
        shell: powershell
        run: |
          # build.ps1 le contrôle déjà, mais on le redit ici pour que l'échec soit
          # explicite dans le journal : sans BOM, PS 5.1 lit le fichier en ANSI.
          $sansBom = @()
          foreach ($f in (Get-ChildItem src\*.ps1) + (Get-Item build.ps1)) {
            $o = [System.IO.File]::ReadAllBytes($f.FullName)[0..2]
            if (-not ($o[0] -eq 0xEF -and $o[1] -eq 0xBB -and $o[2] -eq 0xBF)) { $sansBom += $f.Name }
          }
          if ($sansBom.Count -gt 0) {
            Write-Host "::error::Modules sans BOM (accents illisibles en PowerShell 5.1) : $($sansBom -join ', ')"
            exit 1
          }
          Write-Host "Tous les modules sont en UTF-8 avec BOM."

      - name: Le script s'analyse-t-il sans erreur ?
        shell: powershell
        run: |
          $err = $null; $tok = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'dist\MadTweak.ps1'), [ref]$tok, [ref]$err) | Out-Null
          if ($err) {
            $err | ForEach-Object { Write-Host "::error::Ligne $($_.Extent.StartLineNumber) : $($_.Message)" }
            exit 1
          }
          Write-Host "Syntaxe correcte ($($tok.Count) jetons)."

      # Le depot peut etre a jour pendant que le TELECHARGEMENT ment : le bouton des
      # sites pointe sur releases/latest, pas sur dist/. C'est arrive -- la release
      # a servi pendant des heures un fichier anterieur a la traduction complete.
      # Ce controle ne fait pas echouer la construction (dist AVANCE normalement
      # entre deux versions), il rend l'ecart VISIBLE dans le resume du run.
      - name: La derniere release sert-elle encore le bon fichier ?
        if: github.event_name == 'push'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $local = (Get-Item 'dist\MadTweak.ps1').Length
          $json = gh release view --repo $env:GITHUB_REPOSITORY --json tagName,assets 2>$null
          if (-not $json) {
            Write-Host "Aucune release publiee : rien a comparer."
            exit 0
          }
          $r = $json | ConvertFrom-Json
          $asset = @($r.assets | Where-Object { $_.name -like '*.ps1' })[0]
          if (-not $asset) {
            Write-Host "::warning::La release $($r.tagName) ne contient aucun .ps1 telechargeable."
            exit 0
          }
          $ecart = [math]::Abs($local - $asset.size)
          $pct = if ($local -gt 0) { [math]::Round(100 * $ecart / $local, 1) } else { 0 }
          Write-Host "dist local : $local octets"
          Write-Host "release $($r.tagName) : $($asset.size) octets"
          if ($ecart -eq 0) {
            Write-Host "La release sert exactement le fichier construit."
          }
          elseif ($pct -ge 2) {
            Write-Host "::warning::La release $($r.tagName) est en retard de $ecart octets ($pct %) sur dist\MadTweak.ps1. Le bouton Telecharger des sites sert donc une version anterieure — publie une nouvelle release."
          }
          else {
            Write-Host "::notice::Ecart mineur de $ecart octets ($pct %) entre dist et la release $($r.tagName)."
          }
