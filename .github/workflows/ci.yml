name: CI Build & Test Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify dist/MadTweak.ps1 is Up-To-Date
        shell: powershell
        run: |
          & .\build.ps1 -Verifier

      - name: Install Pester 5+
        shell: powershell
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -AllowClobber

      - name: Run Pester Tests
        shell: powershell
        run: |
          Import-Module Pester -Force
          Invoke-Pester .\tests\MadTweak.Tests.ps1 -Passthru


