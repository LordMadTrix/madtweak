name: CI Build & Test Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify dist/MadTweak.ps1 is Up-To-Date
        shell: powershell
        run: |
          & .\build.ps1 -Verifier

      # tests\MadTweak.Tests.ps1 utilise la syntaxe moderne "Should -Be" (Pester 5+),
      # pas "Should Be" (Pester 3, celui livre avec Windows). windows-latest ne
      # garantit pas une version precise par defaut : on epingle explicitement,
      # pour que la CI ne casse pas le jour ou l'image GitHub change de defaut.
      - name: Install Pester 6.0.1
        shell: powershell
        run: |
          Install-Module -Name Pester -RequiredVersion 6.0.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester Tests (Pester 6.0.1)
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 6.0.1 -Force
          $r = Invoke-Pester .\tests\MadTweak.Tests.ps1 -PassThru
          Write-Host "Resultat : $($r.PassedCount) reussis, $($r.FailedCount) echecs sur $($r.TotalCount)"
          if ($r.FailedCount -gt 0) { exit 1 }


